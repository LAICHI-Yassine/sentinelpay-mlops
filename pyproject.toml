[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sentinelpay"
version = "0.1.0"
description = "Real-Time FinTech Fraud Detection & MLOps Engine"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "polars>=1.0.0",
    "pyarrow>=15.0.0",
    "scikit-learn>=1.4.0",
    "lightgbm>=4.3.0",
    "xgboost>=2.0.0",
    "optuna>=3.6.0",
    "mlflow>=2.14.0",
    "shap>=0.45.0",
    "onnx>=1.16.0",
    "onnxruntime>=1.18.0",
    "onnxmltools>=1.12.0",
    "skl2onnx>=1.16.0",
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "redis>=5.0.0",
    "evidently>=0.4.30",
    "prefect>=2.19.0",
    "prometheus-fastapi-instrumentator>=7.0.0",
    "dvc>=3.50.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "httpx>=0.27.0",
    "ruff>=0.4.0",
]